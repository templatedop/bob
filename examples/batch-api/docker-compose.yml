version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: batch-api-postgres
    environment:
      POSTGRES_DB: batchapi
      POSTGRES_USER: batchuser
      POSTGRES_PASSWORD: batchpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batchuser -d batchapi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
